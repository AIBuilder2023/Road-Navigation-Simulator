<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>路网场景分析器 · IPQ-RoadNavigation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  :root{
    --bg:#0f1419; --panel:#171d24; --panel2:#1e252e; --line:#2b3641;
    --fg:#e6edf3; --muted:#8b98a5; --accent:#58a6ff; --warn:#f0883e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .title{font-weight:600;white-space:nowrap}
  header .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  input[type=text],input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:5px 8px;font-size:12px;width:90px}
  input:focus{outline:none;border-color:var(--accent)}
  label.chk{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;cursor:pointer}
  main{flex:1;display:flex;min-height:0}
  #mapWrap{flex:1;position:relative;min-width:0;background:radial-gradient(circle at 50% 40%,#141b23,#0d1218)}
  #map{width:100%;height:100%;display:block}
  #tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);border-radius:6px;
       padding:4px 7px;font-size:12px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
  #legend{position:absolute;left:12px;bottom:12px;background:#0008;border:1px solid var(--line);border-radius:6px;
          padding:6px 8px;font-size:11px;color:var(--muted)}
  #legend .bar{height:8px;width:140px;border-radius:4px;margin:4px 0;
     background:linear-gradient(90deg,#006837,#1a9850,#66bd63,#a6d96a,#d9ef8b,#ffffbf,#fee08b,#fdae61,#f46d43,#d73027,#a50026)}
  #legend .ends{display:flex;justify-content:space-between}
  #side{width:400px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
  #side h2{font-size:14px;margin:0 0 8px}
  #side h3{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px}
  .kv .k{color:var(--muted)}
  .kv .v{font-variant-numeric:tabular-nums;word-break:break-all}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--panel2)}
  tr.cur{background:#1f6feb33}
  .scroll{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .note{color:var(--muted);font-size:12px;background:var(--panel2);border:1px solid var(--line);
        border-radius:6px;padding:8px 10px;margin:8px 0}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
  .pill.arr{color:#3fb950;border-color:#3fb95066}
  .pill.run{color:var(--warn);border-color:#f0883e66}
  footer{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #frames{flex:1;min-width:200px}
  .stats{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .stats b{color:var(--fg);font-weight:600}
  #chartBox{height:180px;position:relative;margin-top:6px}
  #overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;
           flex-direction:column;gap:10px;z-index:50;font-size:14px}
  #overlay.on{display:flex}
  .spinner{width:34px;height:34px;border:3px solid #ffffff22;border-top-color:var(--accent);border-radius:50%;
           animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
</style>
</head>
<body>

<header>
  <span class="title">路网场景分析器</span>
  <button class="primary" id="btnLoad">导入 JSON</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <span class="meta" id="fileMeta">未导入报告</span>
  <span class="spacer"></span>
  <label class="chk"><input type="checkbox" id="showIds" checked> 节点编号</label>
  <input type="text" id="carInput" placeholder="车 ID">
  <button id="btnSearch">查询车</button>
  <button id="btnClear">清除</button>
</header>

<main>
  <div id="mapWrap">
    <svg id="map"></svg>
    <div id="tip"></div>
    <div id="legend">
      <div>颜色 = 当前帧拥堵度　｜　线宽 = 车道数×2　｜　选中 = 蓝色外圈</div>
      <div class="bar"></div>
      <div class="ends"><span>0（畅通）</span><span>1（堵死）</span></div>
    </div>
  </div>
  <aside id="side"></aside>
</main>

<footer>
  <div class="row">
    <span style="color:var(--muted)">时间轴</span>
    <input type="range" id="frames" min="0" max="0" value="0" step="1">
    <span style="color:var(--muted)">帧</span>
    <input type="number" id="frameInput" min="0" value="0" step="1">
    <span id="frameRange" style="color:var(--muted)">/ 0</span>
  </div>
  <div class="stats" id="frameStats"></div>
</footer>

<div id="overlay"><div class="spinner"></div><div id="overlayText">正在解析报告…</div></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  常量：与 visualize/result_congestion.py 使用的 RdYlGn_r 完全一致
 *  （11 个 ColorBrewer 锚点，_r = 低拥堵绿、高拥堵红）
 * ------------------------------------------------------------------ */
const RDYLGN_R = ['#006837','#1a9850','#66bd63','#a6d96a','#d9ef8b','#ffffbf',
                  '#fee08b','#fdae61','#f46d43','#d73027','#a50026'];
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
const RDYLGN_RGB = RDYLGN_R.map(hex2rgb);
function congestionColor(v){
  if (v === null || v === undefined || Number.isNaN(v)) return '#8b98a5';
  v = Math.max(0, Math.min(1, v));
  const x = v * (RDYLGN_RGB.length - 1), i = Math.floor(x), f = x - i;
  const a = RDYLGN_RGB[i], b = RDYLGN_RGB[Math.min(i+1, RDYLGN_RGB.length-1)];
  const c = [0,1,2].map(k => Math.round(a[k] + (b[k]-a[k])*f));
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

/* ------------------------------------------------------------------ *
 *  状态
 * ------------------------------------------------------------------ */
const S = {
  nodes: [], nodeById: new Map(),
  roads: [], roadByKey: new Map(),
  cars: [], carById: new Map(),
  frames: 0, frame: 0,
  rangeMin: 0, rangeMax: 0,
  selRoad: null, selCar: null,
  chart: null, svg: null, roadEls: [], nodeEl: null,
  haloEl: null, labels: [], nodeCircles: [], viewBox: null, ro: null,
  carPathEl: null, dotEl: null, fileName: ''
};

const $ = id => document.getElementById(id);
const fmt = (x, d) => (x === null || x === undefined || Number.isNaN(x)) ? '—' : Number(x).toFixed(d === undefined ? 3 : d);
const key2 = (a,b) => (a < b ? a + '-' + b : b + '-' + a);

/* ------------------------------------------------------------------ *
 *  解析：优先 Web Worker（file:// 下 Chrome 禁止 blob worker，自动回退主线程）
 * ------------------------------------------------------------------ */
const WORKER_SRC = `
self.onmessage = function(e){
  try { self.postMessage({ ok:true, data: JSON.parse(e.data) }); }
  catch (err) { self.postMessage({ ok:false, error: String(err) }); }
};`;

function parseSmart(text, done, fail){
  let worker = null;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type:'application/javascript'})));
  } catch (e) { worker = null; }
  if (!worker){                       // file:// 直开时的回退
    setTimeout(() => { try { done(JSON.parse(text)); } catch (e) { fail(e); } }, 0);
    return;
  }
  let settled = false;
  const fallback = () => {            // worker 不可用（加载失败/被拦）→ 主线程解析
    if (settled) return; settled = true;
    try { worker.terminate(); } catch (e) {}
    setTimeout(() => { try { done(JSON.parse(text)); } catch (e) { fail(e); } }, 0);
  };
  worker.onerror = fallback;
  worker.onmessage = e => {
    if (settled) return; settled = true;
    worker.terminate();
    if (e.data && e.data.ok) done(e.data.data);
    else fail(new Error(e.data ? e.data.error : 'worker parse failed'));
  };
  worker.postMessage(text);
}

/* ------------------------------------------------------------------ *
 *  载入报告
 * ------------------------------------------------------------------ */
const overlay = $('overlay'), overlayText = $('overlayText');
function showOverlay(t){ overlayText.textContent = t || '正在解析报告…'; overlay.classList.add('on'); }
function hideOverlay(){ overlay.classList.remove('on'); }

function buildScene(report, fileName){
  const nodes = (report.nodes || report.map_nodes || []).slice();
  const roadsRaw = (report.roads || []).slice();
  const cong = (report.congestion || report.congestion_logs || []).slice();
  const carsRaw = (report.car_logs || report.cars || report.carLogs || []).slice();

  // 拥堵序列按 (端点对) 建索引
  const congByKey = new Map();
  for (const c of cong){
    const ep = c.endpoints || c.edge || c.road;
    if (!ep || ep.length < 2) continue;
    congByKey.set(key2(ep[0], ep[1]), c.congestion_logs || c.logs || []);
  }
  S.nodes = nodes.map(n => ({ id:n.id, x:n.pos[0], y:n.pos[1], tiled:n.tiled_pos, degrees:n.degrees, connection:n.connection }));
  S.nodeById = new Map(S.nodes.map(n => [n.id, n]));
  S.roads = roadsRaw.map((r, i) => {
    const a = r.ptA !== undefined ? r.ptA : r.a, b = r.ptB !== undefined ? r.ptB : r.b;
    const logs = congByKey.get(key2(a,b)) || null;
    return { i, a, b, length: (r.length !== undefined ? r.length : null), lanes: r.lanes, logs, key: key2(a,b) };
  });
  S.roadByKey = new Map(S.roads.map(r => [r.key, r]));

  // 车：把 logs 归一化成 spawn / 事件时间数组 / 是否到达
  S.cars = carsRaw.map(c => {
    const logs = c.logs || [];
    let spawn = 0;
    if (Array.isArray(logs[0])) spawn = logs[0][1] | 0;
    else if (typeof c.spawn_frame === 'number') spawn = c.spawn_frame;
    const tail = logs.slice(1);
    const arrived = tail.length > 0 && tail[tail.length-1] === 'end';
    const nums = tail.filter(x => typeof x === 'number');
    const route = c.route || [];
    const roads = Math.max(0, route.length - 1);
    const arrive = arrived ? nums[nums.length-1] : null;
    const last = nums.length ? nums[nums.length-1] : spawn;
    return {
      id: c.id, startPt: c.startPt, endPt: c.endPt, route, nums, spawn, arrived, arrive, last,
      roads, time_cost: c.time_cost, total_distance: c.total_distance,
      start: c.startPt !== undefined ? c.startPt : route[0],
      goal: c.endPt !== undefined ? c.endPt : route[route.length-1]
    };
  });
  S.carById = new Map(S.cars.map(c => [c.id, c]));

  S.frames = 1;
  for (const r of S.roads) if (r.logs) S.frames = Math.max(S.frames, r.logs.length);
  for (const c of S.cars) S.frames = Math.max(S.frames, c.last + 1, c.spawn + 1);
  S.frames = Math.max(1, S.frames);

  S.selRoad = null; S.selCar = null;
  S.frame = 0;
  S.rangeMin = 0; S.rangeMax = S.frames - 1;
  S.fileName = fileName || '';
}

function loadReport(report, fileName){
  buildScene(report, fileName);
  const parts = [ (fileName || '报告'),
    '节点 ' + S.nodes.length, '道路 ' + S.roads.length,
    '车 ' + S.cars.length.toLocaleString(), '帧 ' + S.frames.toLocaleString() ];
  if (!S.roads.some(r => r.logs)) parts.push('⚠ 报告内没有 congestion 数据');
  if (!S.cars.length) parts.push('⚠ 报告内没有 car_logs（旧版报告）');
  $('fileMeta').textContent = parts.join(' · ');
  drawMap();
  setRange(0, S.frames - 1);
  setFrame(0);
  renderSide();
  requestAnimationFrame(applyScreenScale);   // 面板内容落定后按最终尺寸再校正一次标记大小
}

$('btnLoad').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  showOverlay('正在读取 ' + f.name + ' …');
  const reader = new FileReader();
  reader.onerror = () => { hideOverlay(); alert('读取文件失败'); };
  reader.onload = () => {
    showOverlay('正在解析 ' + (f.size/1048576).toFixed(1) + ' MB …');
    const text = reader.result;
    parseSmart(text,
      report => { try { loadReport(report, f.name); } catch (err) { alert('报告结构异常：' + err.message); } hideOverlay(); },
      err => { hideOverlay(); alert('JSON 解析失败：' + err.message); });
  };
  reader.readAsText(f);
  e.target.value = '';
};

/* ------------------------------------------------------------------ *
 *  左侧路网图（SVG）
 * ------------------------------------------------------------------ */
function drawMap(){
  const svg = $('map');
  svg.innerHTML = '';
  if (!S.nodes.length) return;
  const xs = S.nodes.map(n => n.x), ys = S.nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const padX = (maxX - minX) * 0.06 + 1, padY = (maxY - minY) * 0.06 + 1;
  const vb = [minX - padX, minY - padY, (maxX - minX) + 2*padX, (maxY - minY) + 2*padY];
  svg.setAttribute('viewBox', vb.join(' '));
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  S.flipY = (maxY + minY);        // y 轴翻转：SVG 的 y 向下

  const NS = 'http://www.w3.org/2000/svg';
  const gHalo = document.createElementNS(NS, 'g');
  const gRoad = document.createElementNS(NS, 'g');
  const gCar  = document.createElementNS(NS, 'g');
  const gNode = document.createElementNS(NS, 'g');
  svg.append(gHalo, gRoad, gCar, gNode);
  S.viewBox = vb;

  // 选中道路的描边（画在路下面，只露出一圈光晕，不遮挡拥堵颜色）
  S.haloEl = document.createElementNS(NS, 'line');
  S.haloEl.setAttribute('stroke', '#58a6ff');
  S.haloEl.setAttribute('stroke-opacity', '0.65');
  S.haloEl.setAttribute('stroke-linecap', 'round');
  S.haloEl.setAttribute('vector-effect', 'non-scaling-stroke');
  S.haloEl.style.display = 'none';
  gHalo.appendChild(S.haloEl);

  S.roadEls = [];
  for (const r of S.roads){
    const A = S.nodeById.get(r.a), B = S.nodeById.get(r.b);
    if (!A || !B) { S.roadEls.push(null); continue; }
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', S.flipY - A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', S.flipY - B.y);
    ln.setAttribute('stroke-width', roadWidthPx(r));   // 线宽 = 车道数 × 2（同原代码 capacity/length*2）
    ln.setAttribute('vector-effect', 'non-scaling-stroke');   // 线宽以像素为单位，不随缩放变化
    ln.setAttribute('stroke-linecap', 'round');
    ln.style.cursor = 'pointer';
    ln.addEventListener('click', ev => { ev.stopPropagation(); selectRoad(r); });
    ln.addEventListener('mousemove', ev => showTip(ev, r));
    ln.addEventListener('mouseleave', hideTip);
    gRoad.appendChild(ln);
    S.roadEls.push(ln);
  }
  // 选中车时画整体路线
  S.carPathEl = document.createElementNS(NS, 'polyline');
  S.carPathEl.setAttribute('fill','none');
  S.carPathEl.setAttribute('stroke','#58a6ff');
  S.carPathEl.setAttribute('stroke-width', 4);
  S.carPathEl.setAttribute('stroke-opacity', .9);
  S.carPathEl.setAttribute('stroke-dasharray','7 5');
  S.carPathEl.setAttribute('vector-effect','non-scaling-stroke');
  S.carPathEl.style.display = 'none';
  gCar.appendChild(S.carPathEl);

  S.nodeEl = gNode;
  S.nodeCircles = []; S.labels = [];
  for (const n of S.nodes){
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', S.flipY - n.y);
    c.setAttribute('vector-effect','non-scaling-stroke');
    c.setAttribute('fill', '#9fb4c7'); c.setAttribute('stroke', '#0d1218'); c.setAttribute('stroke-width', 1.2);
    gNode.appendChild(c); S.nodeCircles.push(c);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', n.x);
    t.dataset.baseY = S.flipY - n.y;
    t.setAttribute('text-anchor','middle');
    t.setAttribute('fill', '#8b98a5'); t.setAttribute('class','nodeLabel');
    t.style.display = $('showIds').checked ? '' : 'none';
    t.textContent = n.id;
    gNode.appendChild(t); S.labels.push(t);
  }

  // 红点（车位置）
  S.dotEl = document.createElementNS(NS, 'circle');
  S.dotEl.setAttribute('fill', '#f85149'); S.dotEl.setAttribute('stroke', '#fff');
  S.dotEl.setAttribute('stroke-width', 1.2);
  S.dotEl.setAttribute('vector-effect','non-scaling-stroke');
  S.dotEl.style.display = 'none';
  gCar.appendChild(S.dotEl);

  svg.addEventListener('click', () => clearSelection());

  // 标记/文字按像素定尺寸；容器尺寸变化时重算
  if (S.ro) S.ro.disconnect();
  S.ro = new ResizeObserver(() => applyScreenScale());
  S.ro.observe($('mapWrap'));
  applyScreenScale();
}

function showTip(ev, road){
  const v = road.logs ? road.logs[S.frame] : null;
  const tip = $('tip');
  tip.innerHTML = '道路 ' + road.a + ' ↔ ' + road.b +
    '<br>长度 ' + fmt(road.length, 1) + ' · 车道 ' + (road.lanes || '—') +
    '<br>第 ' + S.frame + ' 帧拥堵 ' + fmt(v, 3);
  const wrap = $('mapWrap').getBoundingClientRect();
  tip.style.left = (ev.clientX - wrap.left + 12) + 'px';
  tip.style.top  = (ev.clientY - wrap.top  + 12) + 'px';
  tip.style.opacity = 1;
}
function hideTip(){ $('tip').style.opacity = 0; }

/* 线宽表示车道数，与原 matplotlib 代码一致（原式 capacity/length*2 = lanes×2） */
const LANE_PX = 2;
const MAX_LANES = 5;                                  // 与 attributes.py 的 Config_road_generator.max_lanes 一致
const NODE_R_PX = (LANE_PX * MAX_LANES + 4) / 2;      // 节点半径 = (理论最宽路 + 4px)/2 = 7px
const CAR_R_PX  = NODE_R_PX * 0.8;                    // 车红点比节点略小
const LABEL_DY_PX = NODE_R_PX + 3;                    // 节点编号浮在节点上方
function roadWidthPx(r){ return r.lanes ? r.lanes * LANE_PX : 2.2; }

/* 选中道路改用「外圈光晕」表示，不再占用线宽这个通道 */
function updateHalo(){
  const r = S.selRoad, halo = S.haloEl;
  if (!halo) return;
  if (!r){ halo.style.display = 'none'; return; }
  const A = S.nodeById.get(r.a), B = S.nodeById.get(r.b);
  if (!A || !B){ halo.style.display = 'none'; return; }
  halo.setAttribute('x1', A.x); halo.setAttribute('y1', S.flipY - A.y);
  halo.setAttribute('x2', B.x); halo.setAttribute('y2', S.flipY - B.y);
  halo.setAttribute('stroke-width', roadWidthPx(r) + 7);
  halo.style.display = '';
}

/* SVG 的 font-size / r 是用户单位，会随 viewBox 缩放，必须按当前比例折成像素 */
function applyScreenScale(){
  const svg = $('map');
  if (!S.viewBox || !S.labels || !S.labels.length) return;
  const rect = svg.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const s = Math.min(rect.width / S.viewBox[2], rect.height / S.viewBox[3]);   // 每用户单位 = s 像素
  if (!s) return;
  const u = 1 / s;
  for (const t of S.labels){
    t.setAttribute('font-size', (10 * u).toFixed(4));
    t.setAttribute('y', (+t.dataset.baseY - LABEL_DY_PX * u).toFixed(4));
  }
  for (const c of S.nodeCircles) c.setAttribute('r', (NODE_R_PX * u).toFixed(4));
  if (S.dotEl) S.dotEl.setAttribute('r', (CAR_R_PX * u).toFixed(4));
  updateHalo();
}

/* 只更新颜色（拖动时间轴时最频繁的路径） */
function paintRoads(){
  for (let i = 0; i < S.roads.length; i++){
    const el = S.roadEls[i]; if (!el) continue;
    const r = S.roads[i];
    const v = r.logs ? r.logs[S.frame] : null;
    el.setAttribute('stroke', congestionColor(v));
    el.setAttribute('stroke-width', roadWidthPx(r));      // 线宽恒定表示车道数
    el.setAttribute('stroke-opacity', (S.selCar && S.selRoad !== r) ? 0.25 : 1);
  }
  updateHalo();
}

function paintCar(){
  if (!S.selCar){ S.carPathEl.style.display = 'none'; S.dotEl.style.display = 'none'; return; }
  const car = S.selCar;
  // 整体路线
  const pts = car.route.map(id => { const n = S.nodeById.get(id); return n ? (n.x + ',' + (S.flipY - n.y)) : null; })
                      .filter(Boolean).join(' ');
  S.carPathEl.setAttribute('points', pts);
  S.carPathEl.style.display = '';
  // 红点：当前所在道路的中点（到达后放在终点）
  const st = carStateAt(car, S.frame);
  if (!st){ S.dotEl.style.display = 'none'; return; }
  S.dotEl.style.display = '';
  if (st.arrived){
    const n = S.nodeById.get(car.goal);
    if (n){ S.dotEl.setAttribute('cx', n.x); S.dotEl.setAttribute('cy', S.flipY - n.y); }
  } else {
    const A = S.nodeById.get(st.a), B = S.nodeById.get(st.b);
    if (A && B){
      S.dotEl.setAttribute('cx', (A.x + B.x) / 2);
      S.dotEl.setAttribute('cy', S.flipY - (A.y + B.y) / 2);
    }
  }
}

/* 某车在第 T 帧的所在路段：
   nums = [进入路段1, 进入路段2, …]（若已到达，最后一项是到达帧） */
function carStateAt(car, T){
  if (T < car.spawn) return null;
  if (car.arrived && T >= car.arrive) return { arrived:true };
  if (!car.arrived && T > car.last) return null;       // 记录已截止
  const R = car.route.length - 1;
  if (R <= 0) return { arrived:true };
  let k = 0;
  while (k < car.nums.length && car.nums[k] <= T) k++;
  const idx = Math.min(k, R - 1);
  return { arrived:false, idx, a:car.route[idx], b:car.route[idx + 1] };
}

/* ------------------------------------------------------------------ *
 *  时间轴
 * ------------------------------------------------------------------ */
function setRange(min, max){
  S.rangeMin = min; S.rangeMax = max;
  const sl = $('frames');
  sl.min = min; sl.max = max; sl.value = Math.min(Math.max(S.frame, min), max);
  $('frameInput').min = min; $('frameInput').max = max;
  $('frameRange').textContent = '/ ' + max + '（范围 ' + min + '–' + max + '）';
}
function setFrame(f){
  f = Math.round(f);
  if (!S.frames) f = 0; else f = Math.min(S.rangeMax, Math.max(S.rangeMin, f));
  S.frame = f;
  $('frames').value = f;
  $('frameInput').value = f;
  paintRoads(); paintCar(); updateFrameStats();
  if (S.selRoad) renderSide();               // 右侧的“当前帧拥堵”跟着变
  else if (S.selCar) renderSide();
}
$('frames').oninput = e => setFrame(+e.target.value);
$('frameInput').oninput = e => setFrame(+e.target.value || 0);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight'){ setFrame(S.frame + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ setFrame(S.frame - 1); e.preventDefault(); }
});
$('showIds').onchange = e => {
  document.querySelectorAll('.nodeLabel').forEach(t => t.style.display = e.target.checked ? '' : 'none');
};

function updateFrameStats(){
  if (!S.frames){ $('frameStats').textContent = ''; return; }
  let sum = 0, mx = -1, cnt = 0, withCars = 0;
  for (const r of S.roads){
    if (!r.logs) continue;
    const v = r.logs[S.frame];
    if (v === undefined) continue;
    sum += v; cnt++; if (v > mx) mx = v; if (v > 0.05) withCars++;
  }
  let active = 0;
  for (const c of S.cars){
    if (S.frame < c.spawn) continue;
    if (c.arrived ? (S.frame >= c.arrive) : (S.frame > c.last)) continue;
    active++;
  }
  $('frameStats').innerHTML =
    '当前帧 <b>' + S.frame + '</b>' +
    ' · 边均拥堵 <b>' + fmt(cnt ? sum/cnt : null, 3) + '</b>' +
    ' · 最大 <b>' + fmt(mx >= 0 ? mx : null, 3) + '</b>' +
    ' · 拥堵路段(>0.05) <b>' + withCars + '/' + cnt + '</b>' +
    ' · 在途车 <b>' + active.toLocaleString() + '</b>';
}

/* ------------------------------------------------------------------ *
 *  右侧面板
 * ------------------------------------------------------------------ */
function selectRoad(road){
  S.selRoad = road; S.selCar = null;
  setRange(0, S.frames - 1);
  paintRoads(); paintCar(); renderSide();
}
function selectCar(car){
  S.selCar = car; S.selRoad = null;
  setRange(car.spawn, car.arrived ? car.arrive : car.last);   // 轴范围缩到这一段
  paintRoads(); paintCar(); renderSide(); updateFrameStats();
}
function clearSelection(){
  if (!S.selRoad && !S.selCar) return;
  S.selRoad = null; S.selCar = null;
  setRange(0, S.frames - 1);
  $('carInput').value = '';
  paintRoads(); paintCar(); renderSide();
}
$('btnClear').onclick = clearSelection;

function roadStats(r){
  if (!r.logs || !r.logs.length) return null;
  let sum = 0, mx = -1, mn = Infinity, busy = 0;
  for (const v of r.logs){ sum += v; if (v > mx) mx = v; if (v < mn) mn = v; if (v > 0.05) busy++; }
  return { mean: sum / r.logs.length, max: mx, min: mn, busy: busy / r.logs.length };
}

function renderSide(){
  const side = $('side');
  if (S.selCar) return renderCar(side, S.selCar);
  if (S.selRoad) return renderRoad(side, S.selRoad);
  renderOverview(side);
}

function renderOverview(side){
  let sumAll = 0, nAll = 0, mxAll = -1;
  for (const r of S.roads){
    if (!r.logs) continue;
    for (const v of r.logs){ sumAll += v; nAll++; if (v > mxAll) mxAll = v; }
  }
  const arrived = S.cars.filter(c => c.arrived).length;
  const avgSpeed = S.cars.length
    ? S.cars.reduce((s,c) => s + (c.total_distance / c.time_cost || 0), 0) / S.cars.length : null;
  side.innerHTML = `
    <h2>场景概览</h2>
    <div class="kv">
      <div class="k">文件</div><div class="v">${S.fileName || '—'}</div>
      <div class="k">节点 / 道路</div><div class="v">${S.nodes.length} / ${S.roads.length}</div>
      <div class="k">总帧数</div><div class="v">${S.frames.toLocaleString()}</div>
      <div class="k">车辆总数</div><div class="v">${S.cars.length.toLocaleString()}</div>
      <div class="k">已到达</div><div class="v">${arrived.toLocaleString()}（${S.cars.length ? (arrived/S.cars.length*100).toFixed(1) : '—'}%）</div>
      <div class="k">全程时序均拥堵</div><div class="v">${fmt(nAll ? sumAll/nAll : null, 4)}</div>
      <div class="k">全程峰值拥堵</div><div class="v">${fmt(mxAll >= 0 ? mxAll : null, 4)}</div>
      <div class="k">车均速度(距离/时间)</div><div class="v">${fmt(avgSpeed, 3)} 单位/小时</div>
    </div>
    <h3>怎么用</h3>
    <div class="note">
      · 拖动下方时间轴 / 输入帧号（或按 ← → 单帧微调）→ 左侧每条路变成该帧的拥堵颜色<br>
      · 点击任意一条路 → 这里显示它的全部信息与拥堵曲线<br>
      · 输入车 ID 点「查询车」→ 轴范围缩到该车行程，图上标出整体路线与红点位置<br>
      · 点击空白处 / 「清除」→ 回到全场景
    </div>
    <h3>道路长度</h3>
    <div class="scroll"><table>
      <thead><tr><th>路段</th><th>长度</th><th>时序均拥堵</th><th>峰值</th></tr></thead>
      <tbody>${S.roads.map(r => {
        const st = roadStats(r);
        return `<tr class="clickable" data-road="${r.i}"><td>${r.a} ↔ ${r.b}</td>
          <td>${fmt(r.length,1)}</td><td>${st ? fmt(st.mean,4) : '—'}</td><td>${st ? fmt(st.max,3) : '—'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>`;
  side.querySelectorAll('tr[data-road]').forEach(tr =>
    tr.onclick = () => selectRoad(S.roads[+tr.dataset.road]));
}

function renderRoad(side, r){
  const st = roadStats(r);
  const cur = r.logs ? r.logs[S.frame] : null;
  side.innerHTML = `
    <h2><span class="swatch" style="background:${congestionColor(cur)}"></span>道路 ${r.a} ↔ ${r.b}</h2>
    <div class="kv">
      <div class="k">端点</div><div class="v">${r.a} ↔ ${r.b}</div>
      <div class="k">长度</div><div class="v">${fmt(r.length, 1)}</div>
      <div class="k">车道数</div><div class="v">${r.lanes !== undefined ? r.lanes : '报告未导出'}</div>
      <div class="k">当前帧 (${S.frame})</div><div class="v">${fmt(cur, 4)}</div>
      <div class="k">时序均值</div><div class="v">${st ? fmt(st.mean, 4) : '—'}</div>
      <div class="k">峰值 / 最低</div><div class="v">${st ? fmt(st.max, 3) + ' / ' + fmt(st.min, 3) : '—'}</div>
      <div class="k">拥堵时长占比</div><div class="v">${st ? (st.busy*100).toFixed(1) + '% （>0.05）' : '—'}</div>
    </div>
    <h3>该路段拥堵随时间变化</h3>
    <div id="chartBox"><canvas id="roadChart"></canvas></div>
    <div class="note">${r.logs ? '曲线为该路段每一帧的 congestion（共 ' + r.logs.length + ' 帧），竖线 = 当前帧。' : '该报告缺少这条路的 congestion 数据。'}</div>
    <button id="btnBack">返回概览</button>`;
  $('btnBack').onclick = clearSelection;
  if (r.logs) drawRoadChart(r);
}

function drawRoadChart(r){
  const canvas = $('roadChart');
  if (!canvas) return;
  const step = Math.max(1, Math.ceil(r.logs.length / 2000));   // 抽稀，保证流畅
  const data = [];
  for (let i = 0; i < r.logs.length; i += step) data.push({ x:i, y:r.logs[i] });
  if (S.chart){ try { S.chart.destroy(); } catch(e){} S.chart = null; }
  if (window.Chart){
    try {
      S.chart = new Chart(canvas.getContext('2d'), {
      type:'line',
      data:{ datasets:[{ data, borderColor:'#58a6ff', backgroundColor:'#58a6ff22',
                         borderWidth:1.4, pointRadius:0, fill:true, tension:0 }] },
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        parsing:false,
        scales:{
          x:{ type:'linear', min:0, max:Math.max(1, r.logs.length-1),
              ticks:{ color:'#8b98a5', maxTicksLimit:6, font:{size:10} }, grid:{ color:'#2b3641' } },
          y:{ min:0, max:1, ticks:{ color:'#8b98a5', font:{size:10} }, grid:{ color:'#2b3641' } }
        },
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => 'congestion ' + c.parsed.y.toFixed(4) } } }
      },
      plugins:[{ id:'cursor', afterDatasetsDraw(chart){
        const { ctx, chartArea, scales } = chart;
        const x = scales.x.getPixelForValue(S.frame);
        if (x < chartArea.left || x > chartArea.right) return;
        ctx.save(); ctx.strokeStyle = '#f85149'; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke(); ctx.restore();
      }}]
      });
    } catch (err) {
      console.warn('Chart.js 初始化失败，改用内置绘图：', err);
      S.chart = null;
      drawFallbackChart(canvas, r.logs, S.frame);
    }
  } else {
    drawFallbackChart(canvas, r.logs, S.frame);
  }
}

/* 离线兜底：不依赖 CDN 的简易折线图 */
function drawFallbackChart(canvas, logs, cursor){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 360, h = canvas.clientHeight || 180;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#2b3641';
  for (let i = 0; i <= 4; i++){ const y = h * i / 4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.2; ctx.beginPath();
  const step = Math.max(1, Math.ceil(logs.length / w));
  let first = true;
  for (let i = 0; i < logs.length; i += step){
    const x = logs.length > 1 ? (i / (logs.length - 1)) * w : 0;
    const y = h - Math.max(0, Math.min(1, logs[i])) * h;
    first ? (ctx.moveTo(x,y), first = false) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  const cx = logs.length > 1 ? (cursor / (logs.length - 1)) * w : 0;
  ctx.strokeStyle = '#f85149'; ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke();
}

/* ------------------------------------------------------------------ *
 *  车查询
 * ------------------------------------------------------------------ */
function searchCar(){
  const raw = $('carInput').value.trim();
  if (!raw) return;
  const id = Number(raw);
  if (!Number.isFinite(id)){ alert('车 ID 必须是数字'); return; }
  const car = S.carById.get(id);
  if (!car){ alert('没有找到 ID 为 ' + id + ' 的车（报告共 ' + S.cars.length + ' 辆车）'); return; }
  selectCar(car);
  setFrame(Math.max(car.spawn, S.rangeMin));
}
$('btnSearch').onclick = searchCar;
$('carInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchCar(); });

function renderCar(side, car){
  const st = carStateAt(car, S.frame);
  const speed = car.time_cost ? car.total_distance / car.time_cost : null;
  const rows = [];
  rows.push({ t:car.spawn, label:'生成', detail:'起点节点 ' + car.start });
  for (let k = 0; k < car.nums.length; k++){
    const isArrive = car.arrived && k === car.nums.length - 1;
    rows.push({
      t: car.nums[k],
      label: isArrive ? '到达' : ('进入路段 ' + (k + 1)),
      detail: isArrive ? ('终点节点 ' + car.goal)
                       : (car.route[k] + ' → ' + car.route[k + 1])
    });
  }
  const curRoadTxt = !st ? '不在记录区间内'
    : st.arrived ? '已到达终点'
    : ('路段 ' + st.idx + '：' + st.a + ' → ' + st.b + '（红点画在该路中点）');

  side.innerHTML = `
    <h2>车 #${car.id} <span class="pill ${car.arrived ? 'arr' : 'run'}">${car.arrived ? '已到达' : '未完成'}</span></h2>
    <div class="kv">
      <div class="k">起点 → 终点</div><div class="v">${car.start} → ${car.goal}</div>
      <div class="k">路线节点数</div><div class="v">${car.route.length}（${car.roads} 段）</div>
      <div class="k">完整路线</div><div class="v">${car.route.join(' → ')}</div>
      <div class="k">生成帧</div><div class="v">${car.spawn}</div>
      <div class="k">${car.arrived ? '到达帧' : '记录截止帧'}</div><div class="v">${car.arrived ? car.arrive : car.last}${car.arrived ? '（' + (car.arrive - car.spawn) + ' 帧）' : '（未到达终点）'}</div>
      <div class="k">time_cost</div><div class="v">${fmt(car.time_cost, 4)}（仿真小时）</div>
      <div class="k">total_distance</div><div class="v">${fmt(car.total_distance, 3)}</div>
      <div class="k">均速</div><div class="v">${fmt(speed, 3)} 单位/小时</div>
      <div class="k">当前帧 (${S.frame})</div><div class="v">${curRoadTxt}</div>
      ${(st && !st.arrived) ? '<div class="k">该路段当前拥堵</div><div class="v">' +
        fmt((S.roadByKey.get(key2(st.a, st.b)) || {}).logs ? S.roadByKey.get(key2(st.a, st.b)).logs[S.frame] : null, 4) + '</div>' : ''}
    </div>
    <h3>行程记录（点行可跳到该帧）</h3>
    <div class="scroll"><table>
      <thead><tr><th>帧</th><th>事件</th><th>位置</th></tr></thead>
      <tbody>${rows.map(x => `<tr class="clickable ${x.t === S.frame ? 'cur' : ''}" data-frame="${x.t}">
        <td>${x.t}</td><td>${x.label}</td><td>${x.detail}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="note">
      · 时间轴已缩到该车的行程范围（${car.spawn} – ${car.arrived ? car.arrive : car.last}）<br>
      · 蓝虚线 = 整体路线；红点 = 当前所在路段的中点<br>
      · 该车时间轴外的帧无法再前进（未完成的车只到记录截止帧）
    </div>
    <button id="btnBack2">返回概览</button>`;
  $('btnBack2').onclick = clearSelection;
  side.querySelectorAll('tr[data-frame]').forEach(tr =>
    tr.onclick = () => { setFrame(+tr.dataset.frame); renderCar(side, car); });
}

/* 初始化空状态 */
renderSide();
</script>
</body>
</html>
